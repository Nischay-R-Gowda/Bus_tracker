<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration — Bus Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">🚌</span>
        <h1>Bus Tracker</h1>
        <p class="auth-subtitle">Student Registration</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Your full name" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />
        </div>

        <button type="submit" class="auth-btn">Register</button>
        <div id="error" class="error-message hidden"></div>
        <div id="success" class="success-message hidden"></div>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/student/login.html">Login</a></p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "";

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError("error");
      document.getElementById("success").classList.add("hidden");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!name || !email || !password) {
        showError("error", "Name, email, and password are required.");
        return;
      }
      if (password.length < 6) {
        showError("error", "Password must be at least 6 characters.");
        return;
      }
      if (password !== confirmPassword) {
        showError("error", "Passwords do not match.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json();
        if (!res.ok) {
          showError("error", data.message || "Registration failed.");
          return;
        }

        document.getElementById("success").textContent = "Registration successful! Redirecting to login...";
        document.getElementById("success").classList.remove("hidden");

        setTimeout(() => {
          window.location.href = "/student/login.html";
        }, 1500);
      } catch (err) {
        showError("error", "Network error. Please try again.");
      }
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove("hidden");
    }
    function hideError(id) {
      const el = document.getElementById(id);
      el.classList.add("hidden");
    }
  </script>
</body>
</html>
