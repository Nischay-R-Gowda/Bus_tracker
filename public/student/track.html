<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Bus — Bus Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <span class="logo-icon">🚌</span>
      <span class="logo-text">Bus Tracker</span>
    </div>
    <div class="nav-links">
      <span id="studentNameDisplay" class="user-name">Student</span>
      <a href="#" class="nav-link" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container" style="margin-top:20px;max-width:800px;">
    <h1 class="page-title">Track Your Bus</h1>

    <!-- Bus Selector -->
    <div class="card">
      <div class="form-row">
        <div class="form-group" style="flex:1;">
          <label for="busSelect">Select Bus</label>
          <select id="busSelect">
            <option value="">-- Select a bus to track --</option>
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;">
          <button class="btn btn-primary" id="trackBtn" onclick="startTracking()" disabled>Track Bus</button>
        </div>
      </div>
      <div id="trackError" class="error-message hidden"></div>
    </div>

    <!-- Tracking Info -->
    <div id="trackingInfo" class="card hidden">
      <h2 id="trackBusTitle">Bus Location</h2>
      <div class="info-grid">
        <div class="info-item">
          <span class="info-label">Status</span>
          <span id="busStatus" class="badge badge-danger">OFFLINE</span>
        </div>
        <div class="info-item">
          <span class="info-label">Movement</span>
          <span id="movementStatus" class="badge badge-not-started">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Last Update</span>
          <span id="lastUpdate">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">GPS Accuracy</span>
          <span id="gpsAccuracy">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Distance</span>
          <span id="distanceDisplay">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Driver</span>
          <span id="driverName">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Phone</span>
          <span id="driverPhone">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">Route</span>
          <span id="busRoute">—</span>
        </div>
        <!-- ETA Section -->
        <div class="info-item" id="nextStopItem" style="display:none;">
          <span class="info-label">Next Stop</span>
          <span id="nextStopName" class="next-stop-badge">—</span>
        </div>
        <div class="info-item" id="etaItem" style="display:none;">
          <span class="info-label">ETA</span>
          <span id="etaValue" class="eta-value highlight">—</span>
        </div>
        <div class="info-item" id="etaDistItem" style="display:none;">
          <span class="info-label">Remaining</span>
          <span id="etaDistance">—</span>
        </div>
      </div>
      <p id="locationWarning" class="warning-text hidden">Location may no longer be live. Last update was more than 60 seconds ago.</p>
    </div>

    <!-- Map -->
    <div id="map" class="map-container"></div>
  </div>

  <script src="/js/gps-utils.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ==================== STATE ====================
    let map = null;
    let busMarker = null;
    let collegeMarker = null;
    let socket = null;
    let currentBusId = null;
    let currentBusName = "";
    let currentRoute = null;
    let userLat = null;
    let userLng = null;
    let updateInterval = null;
    let stopMarkers = [];
    let routeLine = null;
    let allRoutes = [];
    let buses = [];

    const COLLEGE_LOCATION = { lat: window.COLLEGE_LAT || 15.3647, lng: window.COLLEGE_LNG || 75.1240 };
    const HAVERSINE_R = 6371;

    // Movement tracking
    let studentGpsReadings = [];
    let studentMovementInterval = null;
    const STOP_THRESHOLD_SECONDS = 120;
    const MOVEMENT_THRESHOLD_MPS = 0.5;

    // ==================== INIT ====================
    document.addEventListener("DOMContentLoaded", async () => {
      initMap();
      await loadRoutes();
      await loadBuses();
      await checkAuth();
      await detectUserLocation();
    });

    // ==================== ROUTES ====================
    async function loadRoutes() {
      try {
        const res = await fetch("/api/public/routes");
        const data = await res.json();
        allRoutes = data.routes || [];
        updateCollegeMarker();
      } catch (e) {
        console.error("Failed to load routes:", e);
      }
    }

    function updateCollegeMarker() {
      // Use the last stop of the first route as the college/destination
      const route = allRoutes[0];
      if (!route || !route.stops || route.stops.length === 0) return;

      const lastStop = route.stops[route.stops.length - 1];
      const collegeName = lastStop.name || window.COLLEGE_NAME || "College";

      COLLEGE_LOCATION.lat = lastStop.latitude;
      COLLEGE_LOCATION.lng = lastStop.longitude;

      if (collegeMarker && map) {
        collegeMarker.setLatLng([COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng]);
        collegeMarker.setIcon(L.divIcon({
          className: "college-marker",
          html: `<div style="background:#2563eb;color:white;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);">🎓 ${escapeHtml(collegeName)}</div>`,
          iconSize: [0, 0],
          iconAnchor: [50, 20],
        }));
      }
    }

    function getStopsForBus(busId) {
      const bus = buses.find(b => b.id === busId);
      if (!bus || !bus.routeName) return [];
      const route = allRoutes.find(r => r.name === bus.routeName);
      if (!route || !route.stops) return [];
      return route.stops;
    }

    function getRouteForBus(busId) {
      const bus = buses.find(b => b.id === busId);
      if (!bus || !bus.routeName) return null;
      return allRoutes.find(r => r.name === bus.routeName) || null;
    }

    // ==================== AUTH ====================
    function checkAuth() {
      const token = localStorage.getItem("busTrackerToken");
      if (!token) {
        window.location.href = "/student/login.html";
        return Promise.resolve();
      }
      return fetch("/api/auth/me", {
        headers: { "Authorization": `Bearer ${token}` }
      })
        .then(res => {
          if (!res.ok) throw new Error("Not authenticated");
          return res.json();
        })
        .then(data => {
          if (data.user && data.user.role === "STUDENT") {
            document.getElementById("studentNameDisplay").textContent = data.user.name;
          } else {
            localStorage.removeItem("busTrackerToken");
            localStorage.removeItem("busTrackerUser");
            window.location.href = "/student/login.html";
          }
        })
        .catch(() => {
          localStorage.removeItem("busTrackerToken");
          localStorage.removeItem("busTrackerUser");
          window.location.href = "/student/login.html";
        });
    }

    function detectUserLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(); return; }
        navigator.geolocation.getCurrentPosition(
          (pos) => { userLat = pos.coords.latitude; userLng = pos.coords.longitude; resolve(); },
          () => resolve(),
          { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 }
        );
      });
    }

    // ==================== MAP ====================
    function initMap() {
      map = L.map("map").setView([COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng], 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(map);

      // College/destination marker — will be updated when routes load
      const collegeIcon = L.divIcon({
        className: "college-marker",
        html: `<div style="background:#2563eb;color:white;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.3);">🎓 ${window.COLLEGE_NAME || "College"}</div>`,
        iconSize: [0, 0],
        iconAnchor: [50, 20],
      });
      collegeMarker = L.marker([COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng], { icon: collegeIcon }).addTo(map);

      const busIcon = L.divIcon({
        className: "bus-marker",
        html: `<div style="font-size:36px;transform:translate(-50%,-100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,0.4));">🚌</div>`,
        iconSize: [36, 36],
        iconAnchor: [18, 36],
      });
      busMarker = L.marker([COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng], { icon: busIcon }).addTo(map);

      const userIcon = L.divIcon({
        className: "user-marker",
        html: `<div style="font-size:24px;transform:translate(-50%,-50%);">📍</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
      });
      if (userLat && userLng) {
        L.marker([userLat, userLng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map).bindPopup("Your location");
      }
    }

    // ==================== BUS LOADING ====================
    async function loadBuses() {
      const { status, data } = await apiCall("/api/public/buses");
      if (status === 200) {
        buses = data.buses || [];
        const select = document.getElementById("busSelect");
        select.innerHTML = '<option value="">-- Select a bus to track --</option>' +
          buses.map(b => `<option value="${b.id}" data-route="${b.routeName || ""}">${b.busNumber}${b.routeName ? ' — ' + b.routeName : ''}</option>`).join("");
      }
    }

    document.getElementById("busSelect")?.addEventListener("change", function () {
      document.getElementById("trackBtn").disabled = !this.value;
      const selected = this.options[this.selectedIndex];
      currentBusId = this.value ? parseInt(this.value) : null;
      currentBusName = this.value ? selected.text : "";
    });

    // ==================== TRACKING ====================
    function startTracking() {
      if (!currentBusId) return;
      const routeName = document.getElementById("busSelect").options[document.getElementById("busSelect").selectedIndex].dataset.route;
      currentRoute = routeName || null;
      document.getElementById("trackBusTitle").textContent = `Tracking: ${currentBusName}`;
      document.getElementById("trackingInfo").classList.remove("hidden");
      document.getElementById("trackError").classList.add("hidden");
      document.getElementById("locationWarning").classList.add("hidden");

      // Reset movement tracking
      studentGpsReadings = [];
      startStudentMovementTracking();

      // Reset route line and stop markers
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      stopMarkers.forEach(m => map.removeLayer(m));
      stopMarkers = [];

      // Draw route polyline and landmark markers
      const stops = getStopsForBus(currentBusId);
      if (stops.length > 0) {
        const latLngs = stops.map(s => [s.latitude, s.longitude]);
        routeLine = L.polyline(latLngs, {
          color: "#06b6d4", weight: 4, opacity: 0.7,
          dashArray: "8, 6", lineCap: "round",
        }).addTo(map);

        stops.forEach((stop, idx) => {
          const icon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker">' + (idx + 1) + '</div>',
            iconSize: [26, 26], iconAnchor: [13, 13],
          });
          const marker = L.marker([stop.latitude, stop.longitude], { icon })
            .addTo(map)
            .bindPopup("<b>" + escapeHtml(stop.name) + "</b>" +
              (idx === 0 ? " (Start)" : idx === stops.length - 1 ? " (End)" : ""));
          stopMarkers.push(marker);
        });

        const bounds = L.latLngBounds(latLngs);
        bounds.extend([COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng]);
        map.fitBounds(bounds.pad(0.3), { maxZoom: 15 });
      }

      connectSocket();
      fitMapToMarkers();

      // Poll for location every 15 seconds as fallback
      setInterval(async () => {
        if (!currentBusId) return;
        try {
          const token = localStorage.getItem("busTrackerToken");
          const res = await fetch(`/api/public/location/${currentBusId}`, {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          if (data.location) {
            updateBusLocation(data.location);
            // Update driver info from trip
            if (data.trip && data.trip.driverName) {
              showDriverInfo(data.trip.driverName, data.trip.driverPhone);
            }
          }
        } catch (e) { console.log("Polling error:", e.message); }
      }, 15000);

      document.getElementById("busRoute").textContent = currentRoute || "No route assigned";
    }

    // ==================== MOVEMENT TRACKING (Student) ====================
    function startStudentMovementTracking() {
      stopStudentMovementTracking();
      studentGpsReadings = [];
      setMovementBadge("ACQUIRING", "badge-not-started");

      studentMovementInterval = setInterval(() => {
        if (!currentBusId) { stopStudentMovementTracking(); return; }
        evaluateStudentMovement();
      }, 5000);
    }

    function stopStudentMovementTracking() {
      if (studentMovementInterval) {
        clearInterval(studentMovementInterval);
        studentMovementInterval = null;
      }
      studentGpsReadings = [];
    }

    function recordStudentGpsReading(lat, lng, speed) {
      studentGpsReadings.push({
        timestamp: Date.now(),
        speed: speed || 0,
        lat, lng,
      });
      // Keep only readings within 2x the stale window
      const cutoff = Date.now() - 180000;
      studentGpsReadings = studentGpsReadings.filter(r => r.timestamp >= cutoff);
    }

    function evaluateStudentMovement() {
      if (studentGpsReadings.length === 0) {
        setMovementBadge("WAITING", "badge-not-started");
        return;
      }

      const now = Date.now();
      const newest = studentGpsReadings[studentGpsReadings.length - 1];
      const timeSinceLast = (now - newest.timestamp) / 1000;

      // No recent updates → STALE
      if (timeSinceLast > 90) {
        const mins = Math.floor(timeSinceLast / 60);
        setMovementBadge(`STALE • ${mins} min`, "badge-offline");
        return;
      }

      // Check for stop: look at readings in the last 2 minutes
      const windowStart = now - STOP_THRESHOLD_SECONDS * 1000;
      const windowReadings = studentGpsReadings.filter(r => r.timestamp >= windowStart);

      if (windowReadings.length >= 2) {
        const first = windowReadings[0];
        const last = windowReadings[windowReadings.length - 1];
        const maxSpeed = Math.max(...windowReadings.map(r => r.speed));
        const totalDist = haversineDistance(first.lat, first.lng, last.lat, last.lng);

        if (maxSpeed < MOVEMENT_THRESHOLD_MPS && totalDist < 5) {
          const stoppedDuration = Math.floor((now - first.timestamp) / 1000);
          const mins = Math.floor(stoppedDuration / 60);
          const secs = stoppedDuration % 60;
          const durationStr = mins > 0 ? `${mins} min` : `${secs}s`;
          setMovementBadge(`STOPPED • ${durationStr}`, "badge-warning");
          return;
        }
      }

      setMovementBadge("MOVING", "badge-live");
    }

    function setMovementBadge(text, cssClass) {
      const el = document.getElementById("movementStatus");
      if (!el) return;
      el.textContent = text;
      el.className = "badge " + cssClass;
    }

    function connectSocket() {
      if (socket) socket.disconnect();
      socket = io();

      socket.on("connect", () => {
        console.log("Connected to tracking server");
        if (currentBusId) socket.emit("student:join-bus", currentBusId);
      });

      socket.on("location:update", (data) => {
        if (data.busId === currentBusId) {
          updateBusLocation(data);
        }
      });

      socket.on("trip:status", (data) => {
        if (data.busId === currentBusId) {
          updateBusStatus(data);
        }
      });

      socket.on("connect_error", () => {
        document.getElementById("lastUpdate").textContent = "Connection lost. Retrying...";
      });

      socket.on("reconnect", () => {
        if (currentBusId) socket.emit("student:join-bus", currentBusId);
      });
    }

    // ==================== ETA COMPUTATION ====================
    function computeAndDisplayETA(busLat, busLng) {
      const stops = getStopsForBus(currentBusId);
      if (!stops || stops.length === 0) {
        hideETA();
        return;
      }

      const nearest = findNextStop(busLat, busLng, stops);
      if (!nearest) { hideETA(); return; }

      const { etaMinutes, distanceKm } = calculateETA(nearest.distanceMeters, 25);

      // Show ETA fields
      document.getElementById("nextStopItem").style.display = "";
      document.getElementById("etaItem").style.display = "";
      document.getElementById("etaDistItem").style.display = "";

      document.getElementById("nextStopName").textContent = nearest.name;
      document.getElementById("etaValue").textContent = etaMinutes + " min";
      document.getElementById("etaDistance").textContent = distanceKm + " km";

      // Highlight next stop marker on map
      stopMarkers.forEach((marker, idx) => {
        if (stops[idx].name === nearest.name) {
          const icon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker next-stop">' + (idx + 1) + '</div>',
            iconSize: [26, 26], iconAnchor: [13, 13],
          });
          marker.setIcon(icon);
          marker.setZIndexOffset(1000);
        } else {
          const icon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker">' + (idx + 1) + '</div>',
            iconSize: [26, 26], iconAnchor: [13, 13],
          });
          marker.setIcon(icon);
          marker.setZIndexOffset(0);
        }
      });
    }

    function hideETA() {
      document.getElementById("nextStopItem").style.display = "none";
      document.getElementById("etaItem").style.display = "none";
      document.getElementById("etaDistItem").style.display = "none";
    }

    // ==================== LOCATION UPDATE ====================
    function updateBusLocation(data) {
      if (!busMarker) return;

      const lat = parseFloat(data.latitude);
      const lng = parseFloat(data.longitude);
      if (isNaN(lat) || isNaN(lng)) return;

      busMarker.setLatLng([lat, lng]);
      busMarker.bindPopup(`<b>${currentBusName}</b><br>Last update: ${new Date(data.timestamp).toLocaleTimeString()}`).openPopup();

      fitMapToMarkers();

      // Update info panel
      document.getElementById("lastUpdate").textContent = new Date(data.timestamp).toLocaleTimeString();
      document.getElementById("gpsAccuracy").textContent = data.accuracy ? `${Math.round(data.accuracy)}m` : "N/A";
      document.getElementById("locationWarning").classList.add("hidden");
      document.getElementById("distanceDisplay").textContent = calculateDistance(lat, lng, COLLEGE_LOCATION.lat, COLLEGE_LOCATION.lng);

      if (data.speed !== undefined && data.speed !== null) {
        document.getElementById("busStatus").textContent = `${Math.round(data.speed * 3.6)} km/h`;
      } else {
        document.getElementById("busStatus").textContent = "ACTIVE";
      }
      document.getElementById("busStatus").className = "badge badge-success";

      // Record for movement tracking
      recordStudentGpsReading(lat, lng, data.speed);

      // Compute ETA
      computeAndDisplayETA(lat, lng);

      // Stale detection
      if (updateInterval) clearTimeout(updateInterval);
      updateInterval = setTimeout(() => {
        const el = document.getElementById("locationWarning");
        if (!el.classList.contains("hidden")) return;
        const now = Date.now();
        const updateTime = new Date(data.timestamp).getTime();
        if (now - updateTime > 60000) {
          el.classList.remove("hidden");
          document.getElementById("busStatus").textContent = "LIVE (stale)";
          document.getElementById("busStatus").className = "badge badge-warning";
          setMovementBadge("STALE", "badge-offline");
        }
      }, 60000);
    }

    function updateBusStatus(data) {
      const badge = document.getElementById("busStatus");
      if (data.status === "ENDED") {
        badge.textContent = "TRIP ENDED";
        badge.className = "badge badge-offline";
        setMovementBadge("OFFLINE", "badge-offline");
        clearDriverInfo();
      } else if (data.status === "STARTED") {
        badge.textContent = "ACTIVE";
        badge.className = "badge badge-success";
        // Show driver info if provided in the event
        if (data.trip) {
          showDriverInfo(data.trip.driverName, data.trip.driverPhone);
        }
      } else if (data.status === "INACTIVE") {
        badge.textContent = "OFFLINE";
        badge.className = "badge badge-danger";
        setMovementBadge("OFFLINE", "badge-offline");
        clearDriverInfo();
      }
    }

    function showDriverInfo(name, phone) {
      const driverNameEl = document.getElementById("driverName");
      const driverPhoneEl = document.getElementById("driverPhone");
      if (driverNameEl && name) {
        driverNameEl.textContent = name;
        driverNameEl.classList.remove("hidden");
      }
      if (driverPhoneEl && phone) {
        driverPhoneEl.textContent = phone;
        driverPhoneEl.classList.remove("hidden");
      }
    }

    function clearDriverInfo() {
      const driverNameEl = document.getElementById("driverName");
      const driverPhoneEl = document.getElementById("driverPhone");
      if (driverNameEl) {
        driverNameEl.textContent = "—";
      }
      if (driverPhoneEl) {
        driverPhoneEl.textContent = "—";
      }
    }

    function fitMapToMarkers() {
      const bounds = L.latLngBounds([]);
      if (collegeMarker) bounds.extend(collegeMarker.getLatLng());
      if (busMarker && busMarker.getLatLng()) bounds.extend(busMarker.getLatLng());
      if (userLat && userLng) bounds.extend([userLat, userLng]);
      stopMarkers.forEach(m => bounds.extend(m.getLatLng()));
      if (routeLine) bounds.extend(routeLine.getBounds());
      if (bounds.isValid()) {
        map.fitBounds(bounds.pad(0.2), { maxZoom: 16 });
      }
    }

    // ==================== UTILITIES ====================
    function haversineDistance(lat1, lon1, lat2, lon2) {
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return HAVERSINE_R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateDistance(lat, lng, collegeLat, collegeLng) {
      const distKm = haversineDistance(lat, lng, collegeLat, collegeLng);
      return distKm < 1 ? `${Math.round(distKm * 1000)} m away` : `${distKm.toFixed(1)} km away`;
    }

    function logout() {
      stopStudentMovementTracking();
      const token = localStorage.getItem("busTrackerToken");
      fetch("/api/auth/logout", {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` }
      }).finally(() => {
        localStorage.removeItem("busTrackerToken");
        localStorage.removeItem("busTrackerUser");
        window.location.href = "/student/login.html";
      });
    }

    // ==================== API HELPERS ====================
    async function apiCall(path, options = {}) {
      try {
        const token = localStorage.getItem("busTrackerToken");
        const headers = { "Content-Type": "application/json" };
        if (token) headers["Authorization"] = `Bearer ${token}`;

        const res = await fetch(path, {
          ...options,
          headers: { ...headers, ...(options.headers || {}) },
        });
        const data = await res.json();
        return { status: res.status, data };
      } catch (err) {
        return { status: 0, data: { message: "Network error" } };
      }
    }
  </script>
</body>
</html>
