<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Bus Tracking — IIIT Dharwad BusTracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .bus-card-info {
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid var(--glass-border);
    }
    .bus-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .bus-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(148,163,184,0.05);
    }
    .bus-detail-row:last-child { border-bottom: none; }
    .bus-detail-label { color: var(--text-muted); }
    .bus-detail-value { color: var(--text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-icon">🚌</div>
      <div class="logo-text">IIIT Dharwad <span>BusTracker</span></div>
    </a>
    <div class="nav-links">
      <a href="/tracking.html" class="nav-link nav-primary">Refresh</a>
      <a href="/login.html?role=ADMIN" class="nav-link">Admin</a>
      <a href="/login.html?role=DRIVER" class="nav-link">Driver</a>
    </div>
  </nav>

  <!-- Tracking Page -->
  <div class="container" style="padding-top: 80px;">
    <div class="tracking-header">
      <div>
        <h1>Live Bus Tracking</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">
          Real-time location of all IIIT Dharwad college buses
        </p>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="connectionStatus">Connecting...</span>
      </div>
    </div>

    <div id="busGrid" class="bus-grid">
      <div class="loading-text" style="grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted);">
        Loading bus data...
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>IIIT Dharwad BusTracker — Frugal Innovation Project</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/gps-utils.js"></script>
  <script>
    // ==================== STATE ====================
    let socket = null;
    let buses = [];
    let busCards = {};  // { busId: { map, marker, lastTimestamp, lastLat, lastLng, routeLine, landmarkMarkers, routeInfo } }
    let allRoutes = [];

    // College location from app.js configuration
    const COLLEGE_LAT = window.COLLEGE_LAT;
    const COLLEGE_LNG = window.COLLEGE_LNG;

    // ==================== INIT ====================
    document.addEventListener("DOMContentLoaded", async () => {
      await loadRoutes();
      loadBuses();
      connectSocket();
      setInterval(updateTimeStamps, 10000);
    });

    // ==================== ROUTES ====================
    async function loadRoutes() {
      try {
        const res = await fetch("/api/public/routes");
        const data = await res.json();
        allRoutes = data.routes || [];
      } catch (e) {
        console.error("Failed to load routes:", e);
      }
    }

    function getRouteForBus(bus) {
      if (!bus.routeName) return null;
      return allRoutes.find(r => r.name === bus.routeName) || null;
    }

    // ==================== LOAD BUSES ====================
    async function loadBuses() {
      try {
        const response = await fetch("/api/public/buses");
        const data = await response.json();
        buses = data.buses || [];

        if (buses.length === 0) {
          document.getElementById("busGrid").innerHTML =
            '<p style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted);">No buses configured yet. Contact your admin.</p>';
          return;
        }

        renderBusGrid();
      } catch (err) {
        console.error("Failed to load buses:", err);
        document.getElementById("busGrid").innerHTML =
          '<p style="grid-column:1/-1;text-align:center;padding:60px;color:var(--error);">Failed to load buses. Please refresh the page.</p>';
      }
    }

    // ==================== RENDER BUS GRID ====================
    function renderBusGrid() {
      const grid = document.getElementById("busGrid");
      const existingIds = new Set(buses.map(b => b.id));

      // Clean up removed buses
      Object.keys(busCards).forEach(id => {
        if (!existingIds.includes(parseInt(id))) {
          const card = busCards[id];
          if (card && card.map) card.map.remove();
          delete busCards[id];
        }
      });

      const html = buses.map(bus => {
        const route = getRouteForBus(bus);
        const stops = route ? route.stops.map(s => s.name).join(" → ") : "No route";
        return `
          <div class="bus-card" id="bus-card-${bus.id}">
            <div class="bus-card-header">
              <div class="bus-identity">
                <div class="bus-icon">🚌</div>
                <div>
                  <h3>${escapeHtml(bus.busNumber)}</h3>
                  <div class="bus-route">${escapeHtml(bus.routeName || "No route assigned")}</div>
                </div>
              </div>
              <div class="status-row">
                <span class="badge badge-offline" id="bus-status-${bus.id}">LOADING</span>
              </div>
            </div>
            <div class="bus-map-container">
              <div id="map-${bus.id}" class="map"></div>
            </div>
            <div class="bus-card-info">
              <div class="bus-meta" id="bus-driver-${bus.id}">
                Driver: ${escapeHtml(bus.driverName || "Unassigned")}
              </div>
              <span id="bus-time-${bus.id}" style="font-size:0.8rem;color:var(--text-muted);">—</span>
            </div>
            <div class="bus-eta-section" id="bus-eta-${bus.id}">
              <div class="eta-row">
                <span class="eta-label">Route</span>
                <span class="eta-value">${escapeHtml(stops)}</span>
              </div>
              <div id="bus-eta-details-${bus.id}">
                <div class="eta-row">
                  <span class="eta-label">Status</span>
                  <span class="eta-value">Waiting for GPS...</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      grid.innerHTML = html;

      buses.forEach(bus => {
        if (!busCards[bus.id] || !busCards[bus.id].map) {
          initBusMap(bus);
        }
        fetchBusLocation(bus.id);
      });
    }

    // ==================== MAP ====================
    function initBusMap(bus) {
      const mapEl = document.getElementById("map-" + bus.id);
      if (!mapEl) return;

      const map = L.map("map-" + bus.id, {
        zoomControl: true,
        attributionControl: true,
      }).setView([COLLEGE_LAT, COLLEGE_LNG], 14);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap",
        maxZoom: 19,
      }).addTo(map);

      // College marker
      const collegeIcon = L.divIcon({
        className: "",
        html: '<div class="college-marker-icon">🏫</div>',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
      });
      L.marker([COLLEGE_LAT, COLLEGE_LNG], { icon: collegeIcon })
        .addTo(map)
        .bindPopup("College Location");

      // Bus marker (invisible initially)
      const busIcon = L.divIcon({
        className: "",
        html: '<div class="bus-marker-icon">🚌</div>',
        iconSize: [36, 36],
        iconAnchor: [18, 18],
      });

      const busMarker = L.marker([COLLEGE_LAT, COLLEGE_LNG], {
        opacity: 0,
        icon: busIcon,
      }).addTo(map);

      const route = getRouteForBus(bus);
      let routeLine = null;
      let landmarkMarkers = [];
      let nextStopName = null;

      // Draw route polyline + landmark markers if route has stops
      if (route && route.stops && route.stops.length > 0) {
        const latLngs = route.stops.map(s => [s.latitude, s.longitude]);

        routeLine = L.polyline(latLngs, {
          color: "#06b6d4",
          weight: 4,
          opacity: 0.7,
          dashArray: "8, 6",
          lineCap: "round",
        }).addTo(map);

        landmarkMarkers = route.stops.map((stop, idx) => {
          const markerIcon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker">' + (idx + 1) + '</div>',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
          });
          const marker = L.marker([stop.latitude, stop.longitude], { icon: markerIcon })
            .addTo(map)
            .bindPopup("<b>" + escapeHtml(stop.name) + "</b>" +
              (idx === 0 ? " (Start)" : idx === route.stops.length - 1 ? " (End)" : ""));
          return marker;
        });

        // Fit bounds to route
        const allPoints = latLngs.slice();
        allPoints.push([COLLEGE_LAT, COLLEGE_LNG]);
        const bounds = L.latLngBounds(allPoints);
        map.fitBounds(bounds.pad(0.3), { maxZoom: 15 });
      }

      busCards[bus.id] = {
        map: map,
        marker: busMarker,
        lastTimestamp: null,
        lastLat: null,
        lastLng: null,
        routeLine: routeLine,
        landmarkMarkers: landmarkMarkers,
        routeInfo: route,
      };
    }

    // ==================== FETCH LOCATION ====================
    async function fetchBusLocation(busId) {
      try {
        const response = await fetch("/api/public/location/" + busId);
        const data = await response.json();

        const card = busCards[busId];
        if (!card) return;

        if (!data.location) {
          // No location data — check trip status
          if (data.trip && data.trip.status === "ACTIVE") {
            updateBusStatus(busId, "WAITING", "Waiting for GPS...");
            updateETA(busId, null, "Waiting for GPS fix");
          } else {
            updateBusStatus(busId, "NOT_STARTED", "Not started");
            updateETA(busId, null, "Trip not started");
          }
          updateDriverInfo(busId, data.trip);
          return;
        }

        const loc = data.location;
        const freshness = data.freshness || {};
        const trip = data.trip;
        const bus = buses.find(b => b.id === busId);
        const route = getRouteForBus(bus);

        // Determine status
        if (trip && trip.status === "ACTIVE") {
          if (freshness.status === "LIVE" || freshness.status === "AGING") {
            updateBusStatus(busId, "LIVE", freshness.status === "LIVE" ? "Live" : freshness.message);
          } else {
            updateBusStatus(busId, "STALE", freshness.message || "Location stale");
          }
        } else {
          updateBusStatus(busId, "NOT_STARTED", "Trip ended");
        }

        // Update driver info from trip
        updateDriverInfo(busId, trip);

        // Update marker
        if (card.marker && card.map) {
          card.marker.setLatLng([loc.latitude, loc.longitude]);
          card.marker.setOpacity(1);
          card.lastTimestamp = loc.timestamp;
          card.lastLat = loc.latitude;
          card.lastLng = loc.longitude;
        }

        // Compute and display ETA
        if (route && route.stops && route.stops.length > 0) {
          const eta = estimateETA(loc.latitude, loc.longitude, route.stops, [], 25);
          if (eta.nextStopName) {
            updateETA(busId, eta, null);
            highlightNextStop(busId, eta.nextStopName, route.stops);
          } else {
            updateETA(busId, null, "No stops on route");
          }
        } else {
          updateETA(busId, null, "No route configured");
        }

        // Update time
        const timeEl = document.getElementById("bus-time-" + busId);
        if (timeEl) {
          if (freshness.ageSeconds !== undefined && freshness.ageSeconds !== null) {
            if (freshness.ageSeconds < 10) timeEl.textContent = "Just now";
            else if (freshness.ageSeconds < 60) timeEl.textContent = freshness.ageSeconds + "s ago";
            else timeEl.textContent = Math.floor(freshness.ageSeconds / 60) + "m ago";
          } else {
            timeEl.textContent = "Live";
          }
        }

      } catch (err) {
        console.error("Failed to fetch location for bus " + busId + ":", err);
      }
    }

    // ==================== UPDATE BUS STATUS ====================
    function updateBusStatus(busId, status, message) {
      const badgeEl = document.getElementById("bus-status-" + busId);
      if (!badgeEl) return;

      let cls, text;
      switch (status) {
        case "LIVE":
          cls = "badge-live"; text = "LIVE"; break;
        case "STALE":
          cls = "badge-offline"; text = "STALE"; break;
        case "WAITING":
          cls = "badge-not-started"; text = "WAITING"; break;
        case "NOT_STARTED":
          cls = "badge-offline"; text = "NOT STARTED"; break;
        default:
          cls = "badge-offline"; text = "OFFLINE";
      }

      badgeEl.className = "badge " + cls;
      badgeEl.textContent = text;
    }

    // ==================== ETA DISPLAY ====================
    function updateETA(busId, eta, message) {
      const detailsEl = document.getElementById("bus-eta-details-" + busId);
      if (!detailsEl) return;

      if (!eta || !eta.nextStopName) {
        detailsEl.innerHTML = '<div class="eta-row"><span class="eta-label">Status</span><span class="eta-value">' + escapeHtml(message || "No data") + '</span></div>';
        return;
      }

      const etaText = eta.etaMinutes !== null && eta.etaMinutes !== undefined
        ? eta.etaMinutes + " min"
        : "—";
      const distText = eta.distanceKm !== null && eta.distanceKm !== undefined
        ? eta.distanceKm + " km"
        : "—";

      detailsEl.innerHTML =
        '<div class="eta-row"><span class="eta-label">Next Stop</span><span class="eta-value next-stop-badge">' + escapeHtml(eta.nextStopName) + '</span></div>' +
        '<div class="eta-row"><span class="eta-label">ETA</span><span class="eta-value highlight">' + escapeHtml(etaText) + '</span></div>' +
        '<div class="eta-row"><span class="eta-label">Distance</span><span class="eta-value">' + escapeHtml(distText) + '</span></div>';
    }

    function highlightNextStop(busId, stopName, stops) {
      const card = busCards[busId];
      if (!card || !card.landmarkMarkers || card.landmarkMarkers.length === 0) return;

      card.landmarkMarkers.forEach((marker, idx) => {
        if (stops[idx].name === stopName) {
          // Highlight: replace icon with glowing version
          const icon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker next-stop">' + (idx + 1) + '</div>',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
          });
          marker.setIcon(icon);
          marker.setZIndexOffset(1000);
        } else {
          const icon = L.divIcon({
            className: "",
            html: '<div class="landmark-marker">' + (idx + 1) + '</div>',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
          });
          marker.setIcon(icon);
          marker.setZIndexOffset(0);
        }
      });
    }

    // ==================== DRIVER INFO ====================
    function updateDriverInfo(busId, trip) {
      const el = document.getElementById("bus-driver-" + busId);
      if (!el) return;
      if (trip && trip.driverName) {
        el.innerHTML = "Driver: " + escapeHtml(trip.driverName) + " (" + escapeHtml(trip.driverPhone || "N/A") + ")";
      } else if (trip && trip.driverId) {
        el.innerHTML = "Driver: Loading...";
      } else {
        el.innerHTML = "Driver: Unassigned";
      }
    }

    // ==================== SOCKET.IO ====================
    function connectSocket() {
      if (socket) {
        try { socket.disconnect(); } catch(e) {}
      }

      socket = io({
        transports: ["websocket", "polling"],
        reconnection: true,
        reconnectionAttempts: 10,
        reconnectionDelay: 1000,
      });

      socket.on("connect", () => {
        document.getElementById("connectionStatus").textContent = "Live — Connected";
      });

      socket.on("disconnect", () => {
        document.getElementById("connectionStatus").textContent = "Reconnecting...";
      });

      socket.on("reconnect", () => {
        document.getElementById("connectionStatus").textContent = "Live — Connected";
      });

      // Receive location updates
      socket.on("location:update", (data) => {
        const busId = data.busId;
        const card = busCards[busId];
        if (!card) return;

        const bus = buses.find(b => b.id === busId);
        const route = getRouteForBus(bus);

        // Move marker
        if (card.marker && card.map) {
          card.marker.setLatLng([data.latitude, data.longitude]);
          card.marker.setOpacity(1);
          card.lastTimestamp = data.timestamp || new Date().toISOString();
          card.lastLat = data.latitude;
          card.lastLng = data.longitude;
        }

        // Update status to LIVE
        updateBusStatus(busId, "LIVE", "Live");

        // Compute and display ETA
        if (route && route.stops && route.stops.length > 0) {
          const eta = estimateETA(data.latitude, data.longitude, route.stops, [], 25);
          if (eta.nextStopName) {
            updateETA(busId, eta, null);
            highlightNextStop(busId, eta.nextStopName, route.stops);
          } else {
            updateETA(busId, null, "No stops on route");
          }
        } else {
          updateETA(busId, null, "No route configured");
        }

        // Update time
        const timeEl = document.getElementById("bus-time-" + busId);
        if (timeEl) {
          timeEl.textContent = "Just now";
        }
      });

      socket.on("trip:status", (data) => {
        buses.forEach(bus => fetchBusLocation(bus.id));
      });
    }

    // ==================== UPDATE TIMESTAMPS EVERY 10s ====================
    function updateTimeStamps() {
      const now = Date.now();
      buses.forEach(bus => {
        const card = busCards[bus.id];
        if (!card || !card.lastTimestamp) return;

        const elapsed = Math.floor((now - new Date(card.lastTimestamp).getTime()) / 1000);
        const timeEl = document.getElementById("bus-time-" + bus.id);
        if (!timeEl) return;

        if (elapsed < 10) timeEl.textContent = "Just now";
        else if (elapsed < 60) timeEl.textContent = elapsed + "s ago";
        else timeEl.textContent = Math.floor(elapsed / 60) + "m ago";

        // Stale detection
        if (elapsed > 60) {
          updateBusStatus(bus.id, "STALE", "Location stale");
        }
      });
    }

    // ==================== HELPERS ====================
    function escapeHtml(str) {
      if (!str && str !== 0) return "";
      const div = document.createElement("div");
      div.textContent = String(str);
      return div.innerHTML;
    }
  </script>
</body>
</html>
